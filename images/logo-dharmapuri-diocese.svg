<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="dharmapuriBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#194f7e"/>
      <stop offset="100%" stop-color="#072239"/>
    </radialGradient>
    <linearGradient id="dharmapuriGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9a6713"/>
    </linearGradient>
    <linearGradient id="dharmapuriWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="56" fill="url(#dharmapuriBg)" stroke="url(#dharmapuriGold)" stroke-width="3"/>
  <circle cx="60" cy="60" r="51" fill="none" stroke="#d4af37" stroke-width="1" stroke-dasharray="3,2" opacity="0.6"/>

  <!-- Pastoral Crosier (Left) -->
  <g transform="translate(42, 60) rotate(-18)">
    <line x1="0" y1="-38" x2="0" y2="40" stroke="url(#dharmapuriGold)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Crosier Spiral Crook -->
    <path d="M0 -38 C0 -50, -16 -50, -16 -38 C-16 -28, -6 -28, -6 -34 C-6 -38, -12 -38, -12 -36" fill="none" stroke="url(#dharmapuriGold)" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Processional Cross (Right) -->
  <g transform="translate(78, 60) rotate(18)">
    <line x1="0" y1="-44" x2="0" y2="40" stroke="url(#dharmapuriGold)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-12" y1="-32" x2="12" y2="-32" stroke="url(#dharmapuriGold)" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="0" cy="-32" r="3" fill="#ffffff"/>
  </g>

  <!-- Episcopal Mitre (Center) -->
  <g transform="translate(60, 36)">
    <!-- Mitre Peak and Body -->
    <path d="M0 -16 L-15 4 L-13 18 L13 18 L15 4 Z" fill="url(#dharmapuriWhite)" stroke="url(#dharmapuriGold)" stroke-width="1.8"/>
    <!-- Mitre Center Fold -->
    <line x1="0" y1="-16" x2="0" y2="18" stroke="url(#dharmapuriGold)" stroke-width="2"/>
    <!-- Mitre Band -->
    <rect x="-13" y="14" width="26" height="5" fill="url(#dharmapuriGold)"/>
    <!-- Cross on Mitre -->
    <path d="M-6 0 L-6 8 M-9 3 L-3 3" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M6 0 L6 8 M3 3 L9 3" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Mitre Infulae (Ribbons) -->
    <path d="M-10 19 L-14 36 L-7 34 L-5 19 Z" fill="url(#dharmapuriWhite)" stroke="url(#dharmapuriGold)" stroke-width="1"/>
    <path d="M10 19 L14 36 L7 34 L5 19 Z" fill="url(#dharmapuriWhite)" stroke="url(#dharmapuriGold)" stroke-width="1"/>
    <!-- Gold fringe on ribbons -->
    <line x1="-14" y1="36" x2="-7" y2="34" stroke="url(#dharmapuriGold)" stroke-width="2"/>
    <line x1="14" y1="36" x2="7" y2="34" stroke="url(#dharmapuriGold)" stroke-width="2"/>
  </g>

  <!-- Open Gospel Book (Holy Bible) at Bottom -->
  <g transform="translate(60, 84)">
    <!-- Book Pages -->
    <path d="M-22 0 C-11 -3, -3 -2, 0 3 C3 -2, 11 -3, 22 0 L22 14 C11 11, 3 12, 0 17 C-3 12, -11 11, -22 14 Z" fill="#ffffff" stroke="url(#dharmapuriGold)" stroke-width="1.5"/>
    <!-- Spine center -->
    <line x1="0" y1="3" x2="0" y2="17" stroke="url(#dharmapuriGold)" stroke-width="1.5"/>
    <!-- Greek Letters Alpha & Omega on pages -->
    <text x="-11" y="10" font-family="serif" font-size="8" font-weight="bold" fill="#08233a" text-anchor="middle">A</text>
    <text x="11" y="10" font-family="serif" font-size="8" font-weight="bold" fill="#08233a" text-anchor="middle">Ω</text>
  </g>

  <!-- Radiance Rays -->
  <circle cx="60" cy="56" r="3.5" fill="url(#dharmapuriGold)"/>
</svg>
